<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Nghiên Cứu — trợ lý đọc tài liệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body class="landing-mode">

<section class="landing-intro" id="landingIntro">
	<div class="landing-sidebar">
		<div class="brand-mini">
			<span class="brand-mark">◉</span>
			<span>ChatBotAI</span>
		</div>
		<nav class="landing-nav" aria-label="Điều hướng giới thiệu">
			<button type="button" class="nav-pill active" data-target="overview">Giới thiệu</button>
			<button type="button" class="nav-pill" data-target="features">Tính năng</button>
			<button type="button" class="nav-pill" data-target="guide">Hướng dẫn</button>
			<button type="button" class="nav-pill" data-target="contact">Liên hệ</button>
		</nav>

	<div class="landing-backdrop"></div>
	<div class="landing-shell">
		<div class="landing-copy reveal-up" id="landingContent">
			<div class="content-block">
				<span class="eyebrow">NotebookLM Clone</span>
				<h1>Sổ Nghiên Cứu</h1>

				<div class="landing-actions">
					<button type="button" class="btn-primary" id="landingLoginBtn">Đăng nhập</button>
					<button type="button" class="btn-secondary landing-register" id="landingRegisterBtn">Đăng ký</button>
				</div>
			</div>
		</div>
	</div>

	<div class="creator-strip reveal-up">
		<span>Bản quyền: Trương Thanh Phong</span>
	</div>
</section>

<script src="/static/landing.js"></script>
